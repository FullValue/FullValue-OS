<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Le Cockpit — pilotage de journée, projets, clients et sessions de travail." />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Apply appearance before the first paint, including the access screen.
      ;(() => {
        let preference = 'system'
        try { preference = localStorage.getItem('cockpit_theme') || 'system' } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161618' : '#f5f5f7'
      })()
    </script>
    <title>Le Cockpit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
